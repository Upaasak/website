  <sc-if value="{{ loading }}">
    <section data-screen-label="Loading" style="max-width: 1520px; margin: 0 auto; padding: 56px 28px 0; min-height: 60vh; font-size: 12px; letter-spacing: 0.2em; color: #7AAE91;">
      <div>▚▚ 06 / NEWS ▞▞</div>
      <div style="margin-top: 22px;">&gt; FETCHING LOG <span class="cms-cursor" style="color: #39FF88;">▌</span></div>
    </section>
  </sc-if>

  <sc-if value="{{ failed }}">
    <section data-screen-label="Error" style="max-width: 1520px; margin: 0 auto; padding: 56px 28px 0; min-height: 60vh;">
      <div style="border: 1px dashed #ffb000; padding: 14px 16px; font-size: 12.5px; letter-spacing: 0.1em; line-height: 1.8; color: #ffb000;">ERR · LOG UNAVAILABLE — the content service did not answer. <a href="news.html">[ ▸ RETRY ]</a></div>
    </section>
  </sc-if>

  <sc-if value="{{ ready }}">
  <section data-screen-label="News header" style="max-width: 1520px; margin: 0 auto; padding: 56px 28px 0;">
    <div style="font-size: 12px; letter-spacing: 0.3em; color: #00D9FF; margin-bottom: 18px;">{{ page.kicker }}</div>
    <h1 style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; margin: 0 0 20px; font-size: clamp(32px, 4.6vw, 56px); font-weight: 800; letter-spacing: 0.02em; color: #D7E0E6; line-height: 1.05; white-space: pre-line;">{{ page.title }}</h1>
    <sc-for list="{{ page.paras }}" as="p">
      <p style="max-width: 68ch; font-size: 14px; line-height: 1.9; color: #A8B3BD; margin: 0 0 12px;">{{ p }}</p>
    </sc-for>
    <sc-if value="{{ notice }}">
      <div style="margin-top: 22px; border: 1px dashed #ffb000; padding: 12px 14px; font-size: 12px; letter-spacing: 0.1em; color: #ffb000;">{{ notice }}</div>
    </sc-if>
  </section>

  <section data-screen-label="Log" style="max-width: 1520px; margin: 0 auto; padding: 40px 28px 0;">
    <div style="display: grid; gap: 14px;">

      <sc-for list="{{ posts }}" as="n">
      <div style="border: 1px solid #163D2A;" style-hover="border-color: #39FF88;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; background: #182027; color: {{ n.headColor }}; font-size: 11.5px; letter-spacing: 0.14em;"><span>{{ n.date }}</span><span>{{ n.tag }}</span></div>
        <sc-if value="{{ n.image }}">
          <img src="{{ n.image }}" alt="{{ n.imageAlt }}" loading="lazy" style="display: block; width: 100%; max-height: 420px; object-fit: cover; border-bottom: 1px solid #163D2A;" />
        </sc-if>
        <div style="padding: 20px 18px; display: grid; gap: 11px;">
          <div style="font-size: 16px; font-weight: 700; color: #D7E0E6; letter-spacing: 0.04em;">{{ n.title }}</div>
          <sc-if value="{{ n.eventLine }}">
            <div style="font-size: 12px; letter-spacing: 0.12em; color: #00D9FF;">{{ n.eventLine }}</div>
          </sc-if>
          <sc-for list="{{ n.paras }}" as="p">
            <p style="margin: 0; font-size: 13.5px; line-height: 1.9; color: #A8B3BD; max-width: 76ch;">{{ p }}</p>
          </sc-for>
          <sc-if value="{{ n.link }}">
            <a href="{{ n.link.href }}" target="{{ n.link.target }}" rel="noopener" style="font-size: 12.5px; letter-spacing: 0.12em;">{{ n.link.label }}</a>
          </sc-if>
        </div>
      </div>
      </sc-for>

    </div>
  </section>
  </sc-if>
